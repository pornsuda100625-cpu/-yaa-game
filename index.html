var qs,tp,i,score,locked,missed;
function $(x){return document.getElementById(x)}
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function toks(d){return d[1].toLowerCase().replace(/\(.*?\)/g,"").split("/").map(function(s){return s.trim()})}
function clash(a,b){
 if(a[0]===b[0])return true;
 var ga=a[4],gb=b[4];for(var k=0;k<ga.length;k++)if(gb.indexOf(ga[k])>=0)return true;
 var ta=toks(a),tb=toks(b);return ta.some(function(t){return tb.indexOf(t)>=0});
}
function start(){qs=sh(D);tp=qs.map(function(){return Math.random()<.5?1:0});i=0;score=0;missed=[];$("e").classList.add("hide");$("g").classList.remove("hide");show()}
function show(){
 var d=qs[i],ty=tp[i];locked=false;
 $("n").textContent="ข้อ "+(i+1)+"/"+qs.length;
 $("sc").textContent="🪙 "+score+" เหรียญ";
 $("b").style.width=(i/qs.length*100)+"%";
 $("ch").textContent=C[d[0]];
 $("fb").textContent="";$("fb").style.color="";
 $("ex").classList.add("hide");
 $("nx").classList.add("hide");
 var pool=D.filter(function(x){return !clash(d,x)&&x[2]!==d[2]&&x[1]!==d[1]});
 var opts=sh(sh(pool).slice(0,3).concat([d]));
 if(ty===0){
  $("q").className="q";$("q").textContent=d[1];
  $("rd").textContent="🗣 อ่านว่า: "+d[3];
  $("pm").textContent="ยานี้มีฤทธิ์อะไร?";
 }else{
  $("q").className="q long";$("q").textContent=d[2];
  $("rd").textContent="";
  $("pm").textContent="ฤทธิ์ยาแบบนี้คือตัวยาอะไร?";
 }
 var o=$("o");o.innerHTML="";
 opts.forEach(function(x){
  var btn=document.createElement("button");
  btn.className="opt";btn.textContent=ty===0?x[2]:x[1];
  btn.onclick=function(){pick(btn,x===d)};
  btn.dataset.ok=x===d?"1":"";
  o.appendChild(btn)});
}
function pick(btn,right){
 if(locked)return;locked=true;
 if(right){score++;btn.classList.add("ok");$("fb").textContent="ถูกต้อง! ได้ 1 เหรียญ 🪙";$("fb").style.color="var(--ok)"}
 else{missed.push(qs[i][1]);btn.classList.add("bad");$("fb").textContent="ยังไม่ถูก ไม่ได้เหรียญ (เฉลยสีเขียว)";$("fb").style.color="var(--bad)"}
 Array.prototype.forEach.call($("o").children,function(b){b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
 var d=qs[i];
 $("ex").innerHTML="💡 <b>"+d[1]+"</b><br>🗣 อ่านว่า: <b>"+d[3]+"</b><br>💊 ฤทธิ์: "+d[2]+"<br>📚 หมวด: "+C[d[0]];
 $("ex").classList.remove("hide");
 $("sc").textContent="🪙 "+score+" เหรียญ";
 $("nx").textContent=i===qs.length-1?"ดูสรุปผล":"ข้อต่อไป";
 $("nx").classList.remove("hide");
}
function next(){
 i++;
 if(i>=qs.length){
  $("g").classList.add("hide");$("e").classList.remove("hide");
  var p=score/qs.length;
  $("em").textContent=p>=.9?"🏆":p>=.6?"🌟":"💪";
  $("fs").textContent="🪙 "+score+" เหรียญ";
  $("ft").innerHTML="ตอบถูก <b>"+score+"</b> ข้อ จาก "+qs.length+" ข้อ<br>ตอบผิด "+(qs.length-score)+" ข้อ (ไม่ได้เหรียญ)<br>"+(p>=.9?"เก่งมาก! รู้จักยาเกือบครบแล้ว":p>=.6?"ดีมาก! ทบทวนอีกนิดจะเก่งขึ้นอีก":"ไม่เป็นไร ลองอ่านหนังสือแล้วเล่นใหม่นะ");
  var m=$("ms");m.textContent="";
  if(missed.length){m.textContent="ยาที่ควรทบทวน: "+missed.join(" • ")}
 } else show();
}
